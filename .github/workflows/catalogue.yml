name: catalogue

# Every push and every proposed change. Artwork the studio would fail to load,
# or that nothing can reach because it is missing from the catalogue, should
# fail here in front of whoever added it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pillow numpy

      - name: Every piece is one the studio can use
        run: python3 tools/art.py check

      # Kyron's own pieces are cut from the sources committed beside them
      # rather than from somebody's image editor. If re-cutting produces a
      # different picture, the committed PNG and the source it claims to come
      # from have come apart, and one of the two is lying.
      #
      # It compares rather than overwrites, and allows a little drift, because
      # this is the output of a JPEG decoder and a resampler -- both of which
      # may legitimately move by a bit when Pillow is upgraded. A hand edit
      # moves it further than that; see DRIFT_MEAN in tools/art.py.
      - name: Kyron's own pieces still match the sources they were cut from
        run: python3 tools/art.py cut --verify

      - name: Render the contact sheet
        run: python3 tools/art.py sheet -o contact-sheet.png

      # What an Actions artifact is for: something a person wants to look at
      # on the pull request. Artwork is judged by eye or not at all.
      - name: Attach the contact sheet for review
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: contact-sheet.png
          retention-days: 30

      - name: Build the site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp catalogue.json site/
          cp contact-sheet.png site/
          cp -r art site/
          python3 - <<'PY'
          import json
          artwork = json.load(open('catalogue.json'))['artwork']
          cards = '\n'.join(
              f'<figure><img src="art/{a["id"]}.png" alt="{a["name"]}">'
              f'<figcaption><b>{a["name"]}</b><br><code>{a["id"]}</code><br>'
              f'<small>{a["author"]} · {a["licence"]}</small></figcaption>'
              f'</figure>' for a in artwork)
          open('site/index.html', 'w').write(f"""<!doctype html>
          <meta charset="utf-8"><title>Kyron artwork</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
            :root {{ color-scheme: light dark; }}
            body {{ font: 15px/1.6 system-ui, sans-serif; max-width: 60rem;
                   margin: 3rem auto; padding: 0 1rem; }}
            .grid {{ display: grid; gap: 1.5rem;
                    grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }}
            figure {{ margin: 0; text-align: center; }}
            figure img {{ width: 100%; aspect-ratio: 1; object-fit: contain;
                         background: #8884; border-radius: 12px; padding: .5rem; }}
            figcaption {{ margin-top: .5rem; font-size: .85em; }}
          </style>
          <h1>Kyron artwork</h1>
          <p>{len(artwork)} pieces, all CC0 — use them for anything, without
          asking. The lens studio reads
          <a href="catalogue.json">catalogue.json</a>; this page is for
          people.</p>
          <div class="grid">{cards}</div>
          """)
          PY

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    name: Publish the catalogue
    # The studio fetches from Pages: a stable public URL, on a CDN, that needs
    # no token. Actions artifacts cannot do that job -- they need
    # authentication to download and they expire.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  confirm:
    name: The studio can actually fetch it
    # Deploying and being fetchable are different claims, and the studio
    # depends on the second. `deploy-pages` reporting success means GitHub
    # accepted a deployment; it does not mean the URL in the studio serves
    # this commit's catalogue. So this asks the published URL, as the studio
    # does, and compares what comes back with what was just committed.
    #
    # It also runs when publishing failed, which is the other half of why it
    # is here. That job carries an `environment:`, so when the environment
    # refuses it the job is rejected before a runner is assigned: no steps, a
    # log that 404s, and the reason readable only through the check-runs
    # annotations API. This says it in the run, where somebody is looking.
    if: always() && github.ref == 'refs/heads/main'
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before blaming a setting, rule out the catalogue. When `check` fails,
      # `publish` never runs and is reported as skipped -- which the step
      # below would otherwise read as "publishing is broken" and send somebody
      # to Settings over a catalogue this repository itself refused.
      - name: Say the catalogue never got as far as publishing
        if: needs.check.result != 'success'
        run: |
          echo "Nothing was published because the catalogue did not pass its"
          echo "own checks. The reason is on the 'Check and render' job; this"
          echo "is not a Pages problem and there is no setting to change."
          exit 1

      - name: Say why publishing failed, if it did
        if: needs.check.result == 'success' && needs.publish.result != 'success'
        run: |
          echo "The catalogue was built but not published, so the studio's"
          echo "library is still whatever was there before this commit."
          echo
          echo "Publishing needs two settings, and each fails differently:"
          echo
          echo "  1. Pages must be on, with Actions as the source."
          echo "     Settings -> Pages -> Source -> GitHub Actions"
          echo "     Wrong:  'Failed to create deployment (status: 404) ..."
          echo "             Ensure GitHub Pages has been enabled'"
          echo
          echo "  2. The github-pages environment must let this branch deploy."
          echo "     Settings -> Environments -> github-pages"
          echo "       -> Deployment branches and tags"
          echo "     Wrong:  'Branch \"${GITHUB_REF_NAME}\" is not allowed to deploy"
          echo "             to github-pages due to environment protection rules'"
          echo
          echo "     This one bites when the environment was created while a"
          echo "     different branch was the default -- the policy still names"
          echo "     that branch. Add ${GITHUB_REF_NAME}, or set the policy to"
          echo "     all branches."
          echo
          echo "The exact message is on the 'Publish the catalogue' job. That"
          echo "job has no log when the environment rejects it, because it is"
          echo "refused before a runner is assigned; the message is then an"
          echo "annotation, which the job summary shows and the log does not."
          exit 1

      - name: The published catalogue is the one in this commit
        if: needs.check.result == 'success' && needs.publish.result == 'success'
        run: |
          set -uo pipefail
          url="https://kyronlabs.github.io/kyron-artwork/catalogue.json"
          want=$(sha256sum catalogue.json | cut -d' ' -f1)

          # A deployment is accepted before the CDN serves it. Two minutes is
          # far longer than it takes and short enough to fail a build rather
          # than hang one.
          for attempt in $(seq 1 12); do
            [ "$attempt" -gt 1 ] && sleep 10
            curl -fsSL --max-time 20 -o served.json "$url" 2>/dev/null
            got=$(sha256sum served.json 2>/dev/null | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              pieces=$(python3 -c "import json;print(len(json.load(open('catalogue.json'))['artwork']))")
              echo "$url serves this commit's catalogue: $pieces pieces."
              exit 0
            fi
            echo "attempt $attempt: not this commit yet"
          done

          echo
          echo "::error::$url did not serve this commit's catalogue within two minutes."
          echo "Publishing reported success, so this is the gap between a"
          echo "deployment being accepted and the URL the studio reads serving"
          echo "it. What the URL answered:"
          echo
          # To a file, not down a pipe: `curl | head` kills curl when head
          # closes the pipe, and the real answer is then buried under
          # "curl: (23) Failure writing output to destination".
          curl -sSL --max-time 20 -w '\nHTTP %{http_code}\n' -o answer.txt "$url" || true
          head -c 2000 answer.txt
          exit 1
